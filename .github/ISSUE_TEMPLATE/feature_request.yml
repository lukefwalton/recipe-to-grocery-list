name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome as issues. Note this repo doesn't accept unsolicited
        feature PRs — see
        [CONTRIBUTING](https://github.com/lukefwalton/recipe-to-grocery-list/blob/main/CONTRIBUTING.md).
        Open an issue first so we can agree on the approach. The v1 non-goals
        (meal planning, nutrition, pantry, scaling, unit conversion, sync,
        widgets) are listed in
        [docs/SPEC.md §2](https://github.com/lukefwalton/recipe-to-grocery-list/blob/main/docs/SPEC.md#2-non-goals-for-v1);
        an idea in that list needs a stronger case, not a smaller one.
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you like to see, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, if any.
    validations:
      required: false
  - type: checkboxes
    id: doctrine
    attributes:
      label: Fits the app's local-first doctrine
      options:
        - label: This works on-device, without accounts, servers, tracking, cloud AI, or making the data leave the phone (beyond the one page fetch the user asks for).
          required: false

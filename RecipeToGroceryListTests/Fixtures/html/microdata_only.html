<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Garlic &amp; Herb Focaccia — Invented Kitchen</title></head>
<body>
  <div itemscope itemtype="http://schema.org/Recipe">
    <h1 itemprop="name">Garlic &amp; Herb Focaccia</h1>
    <meta itemprop="recipeYield" content="One sheet pan" />
    <ul class="ingredients">
      <li itemprop='recipeIngredient'>4 cups bread flour</li>
      <li itemprop='recipeIngredient'>2 &frac14; teaspoons instant yeast</li>
      <li itemprop='recipeIngredient'>2 teaspoons <b>kosher</b> salt</li>
      <li itemprop='recipeIngredient'>&frac12; cup olive oil, divided</li>
      <li itemprop='recipeIngredient'>4 cloves garlic, thinly sliced</li>
      <li itemprop='recipeIngredient'>2 sprigs rosemary</li>
    </ul>
  </div>
</body>
